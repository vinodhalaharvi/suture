# fly.toml — deploy with `fly launch --copy-config --no-deploy` then `fly deploy`
#
# Quick start:
#   fly launch --copy-config --no-deploy   # creates app, picks region
#   fly secrets set ANTHROPIC_API_KEY=...  # only if you want prior_auth_assistant
#   fly deploy

app = "suture"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
